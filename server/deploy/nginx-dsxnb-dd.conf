# Include this inside the existing dsxnb.com HTTPS server block.
# The existing root site (航线) remains the owner of / and all other paths.

location = /dd {
    return 301 /dd/;
}

# Keep health checks on the API process instead of serving the SPA fallback.
location = /dd/health {
    proxy_pass http://127.0.0.1:3310/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /dd/api/ {
    proxy_pass http://127.0.0.1:3310/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
    # The refresh cookie must reach /dd/api/auth and /dd/api/buddy-box/*.
    proxy_cookie_path /api /dd/api;
}

location = /dd/blind-box {
    return 301 /dd/blind-box/;
}

location /dd/blind-box/ {
    alias /var/www/dd/blind-box/;
    index index.html;
}

location /dd/ {
    root /var/www;
    try_files $uri $uri/ /dd/growth-school.html;
}
